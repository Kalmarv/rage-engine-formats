[package]
name = "rage-engine-formats"
description = "Readers for the RAGE engine's GTA V file formats: RPF7 archives, resources, META, drawables, textures, collision bounds, clips and shader containers"
documentation = "https://docs.rs/rage-engine-formats"
readme = "README.md"
keywords = ["gta5", "rage-engine", "rpf", "game-assets", "parser"]
categories = ["parser-implementations", "game-development"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
primase-foundations = { workspace = true, features = ["compress"] }
aes.workspace = true
indexmap.workspace = true
quick-xml.workspace = true
serde.workspace = true
sha1.workspace = true
thiserror.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/rage-engine-formats"
publish = true

[workspace.dependencies]
aes = { version = "=0.9.3", default-features = false }
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
primase-foundations = { version = "0.2.1", git = "https://github.com/Kalmarv/primase-foundations", rev = "e895f966130651bd78c47505b53322cc3f58083a" }
primase-testdata = { version = "0.1.0", git = "https://github.com/Kalmarv/primase-testdata", rev = "d0258530ca9ca0ca74e957716ae8683e7facc8a7" }
quick-xml = { version = "=0.42.0", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
