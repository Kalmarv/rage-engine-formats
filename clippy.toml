allow-unwrap-in-tests = true
allow-expect-in-tests = true

# File, environment and process access. The parsers take bytes and never reach for the file system, the environment or
# a process (`#![deny(clippy::disallowed_methods, clippy::disallowed_types)]` in lib.rs); the few modules that read the
# install's archives and the key files opt back in with an `allow` that gives the reason (CONTRIBUTING.md, "Input and
# output").
